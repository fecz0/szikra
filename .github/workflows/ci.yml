name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Típusellenőrzés + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nuxt prepare
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: E2E (Playwright + mock SAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      # Pontosan azt deployoljuk, amit az e2e letesztelt
      - run: tar -czf szikra-output.tgz -C .output .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: szikra-output
          path: szikra-output.tgz
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    name: Docker image + Trivy
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t szikra:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: szikra:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy
    # main push -> szikra.problemas.hu, saját repós PR -> szikra-preview.problemas.hu
    # Forkról és Dependabotról nem deployolunk (nincs secret, idegen kód).
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-latest
    needs: [quality, e2e, image]
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'main' || 'preview' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ github.event_name == 'push' && 'https://szikra.problemas.hu' || 'https://szikra-preview.problemas.hu' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      TARGET: ${{ github.event_name == 'push' && 'main' || 'preview' }}
      URL: ${{ github.event_name == 'push' && 'https://szikra.problemas.hu' || 'https://szikra-preview.problemas.hu' }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: szikra-output }
      - name: SSH előkészítés
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Feltöltés és újraindítás
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "hermes@${DEPLOY_HOST}" "${TARGET} ${SHA}" < szikra-output.tgz
      - name: Smoke teszt (az új commit fut-e)
        run: |
          for i in $(seq 1 30); do
            got="$(curl -fsS "${URL}/api/health" | jq -r .sha || true)"
            [ "$got" = "$SHA" ] && { echo "OK: ${URL} -> ${SHA}"; exit 0; }
            sleep 2
          done
          echo "A ${URL} nem az elvárt commitot szolgálja ki" >&2; exit 1
      - name: PR-komment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$(cat <<EOF
          ### ⚡ Szikra preview kész
          **Élő preview:** ${URL}
          Commit: \`${HEAD_SHA:0:7}\`

          | Ellenőrzés | Eredmény |
          |---|---|
          | Típusellenőrzés + unit | ✅ |
          | E2E (Playwright, mock SAP) | ✅ |
          | Docker image + Trivy | ✅ |

          **E2E riport, videók, trace:** [${RUN_URL}](${RUN_URL}) (Artifacts → \`playwright-report\`)
          **Demó belépés:** \`DEMO-OKOS\`, \`DEMO-ELMARADT\`, \`DEMO-KARTYA\`, \`DEMO-RENDEZETT\`
          EOF
          )"
